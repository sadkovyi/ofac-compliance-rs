name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.89.0"
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} test --no-default-features
      - run: cargo +${{ matrix.rust }} test --all-features
      - name: Independent feature combinations
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo +${{ matrix.rust }} test --features serde
          cargo +${{ matrix.rust }} test --features cache
          cargo +${{ matrix.rust }} test --features http

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - run: cargo +stable doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +stable package --allow-dirty
