[package]
name = "ofac-compliance"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "OFAC sanctions list parsing and explainable, offline screening"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sadkovyi/ofac-compliance-rs"
keywords = ["ofac", "sanctions", "screening", "compliance"]
categories = ["text-processing", "parser-implementations"]
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE-*", "docs/**"]

[features]
default = []
http = ["dep:ureq"]
cache = ["serde", "dep:serde_json", "dep:tempfile"]
serde = ["dep:serde"]

[dependencies]
roxmltree = "0.20"
strsim = "0.11"
thiserror = "2"
tiny-keccak = { version = "2", features = ["sha3"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
ureq = { version = "3.5", default-features = false, features = ["tls"], optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[example]]
name = "refresh"
required-features = ["http", "cache"]

[[bench]]
name = "screening"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[package.metadata.docs.rs]
all-features = true

