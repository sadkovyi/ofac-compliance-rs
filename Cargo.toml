[package]
name = "ofac-compliance"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "OFAC sanctions list parsing and explainable, offline screening"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = []

[dependencies]
roxmltree = "0.20"
thiserror = "2"
unicode-normalization = "0.1"
tiny-keccak = { version = "2", features = ["sha3"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
